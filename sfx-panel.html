<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Efeitos Sonoros — RPG Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8c96a;
            --gold-dim: #7a6230;
            --parchment: #f4ead5;
            --blood: #8b1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(160deg, #1a1510 0%, #0f0c09 60%, #0a0806 100%);
            color: var(--parchment);
            font-family: 'Crimson Text', Georgia, serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── Header com drag ── */
        .sfx-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.15);
            -webkit-app-region: drag;
            flex-shrink: 0;
        }

        .sfx-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sfx-title-icon {
            font-size: 16px;
            opacity: 0.7;
        }

        .sfx-status {
            font-family: 'Crimson Text', serif;
            font-size: 11px;
            color: rgba(201, 168, 76, 0.3);
            -webkit-app-region: no-drag;
        }

        .sfx-status.connected {
            color: rgba(100, 200, 120, 0.6);
        }

        .sfx-status.error {
            color: rgba(200, 80, 80, 0.6);
        }

        /* ── Volume row ── */
        .sfx-volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .sfx-vol-label {
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-dim);
            flex-shrink: 0;
        }

        .sfx-vol-icon {
            font-size: 14px;
            opacity: 0.5;
            flex-shrink: 0;
        }

        #sfxVolumeSlider {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(201, 168, 76, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #sfxVolumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(201, 168, 76, 0.5);
            transition: box-shadow 0.2s;
        }

        #sfxVolumeSlider::-webkit-slider-thumb:hover {
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.8);
        }

        .sfx-vol-val {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            color: var(--gold-dim);
            width: 32px;
            text-align: right;
            flex-shrink: 0;
        }

        /* ── Grid ── */
        .sfx-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            padding: 14px 16px;
            overflow-y: auto;
            flex: 1;
            align-content: start;
        }

        .sfx-grid::-webkit-scrollbar {
            width: 5px;
        }

        .sfx-grid::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 76, 0.2);
            border-radius: 3px;
        }

        .sfx-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .sfx-grid-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(201, 168, 76, 0.3);
            font-size: 15px;
            padding: 48px 16px;
            line-height: 2;
        }

        /* ── Botão SFX ── */
        .sfx-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            min-height: 76px;
            padding: 11px 13px;
            background: linear-gradient(160deg, rgba(30, 70, 90, 0.4) 0%, rgba(15, 40, 55, 0.55) 100%);
            border: 1px solid rgba(40, 120, 160, 0.3);
            border-radius: 4px;
            color: var(--parchment);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            text-align: left;
            line-height: 1.3;
            -webkit-app-region: no-drag;
        }

        .sfx-btn:hover {
            background: linear-gradient(160deg, rgba(40, 90, 115, 0.55) 0%, rgba(20, 55, 75, 0.65) 100%);
            border-color: rgba(60, 150, 200, 0.5);
            box-shadow: 0 0 14px rgba(40, 120, 160, 0.2);
        }

        .sfx-btn:active,
        .sfx-btn.sfx-playing {
            background: linear-gradient(160deg, rgba(140, 30, 30, 0.55) 0%, rgba(90, 15, 15, 0.65) 100%);
            border-color: rgba(200, 60, 60, 0.5);
            box-shadow: 0 0 18px rgba(180, 40, 40, 0.3);
        }

        .sfx-btn-name {
            flex: 1;
            word-break: break-word;
        }

        .sfx-btn-mode {
            font-family: 'Crimson Text', serif;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: rgba(201, 168, 76, 0.35);
            margin-top: 6px;
        }

        /* ── Cantos decorativos ── */
        body::before {
            content: '';
            position: fixed;
            top: 8px;
            left: 8px;
            width: 16px;
            height: 16px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
            opacity: 0.4;
            pointer-events: none;
            z-index: 10;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
            opacity: 0.4;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="sfx-header">
        <span class="sfx-title">
            <span class="sfx-title-icon">🔊</span>
            <span>Efeitos Sonoros</span>
        </span>
        <span class="sfx-status" id="sfxStatus">Conectando…</span>
    </div>

    <div class="sfx-volume-row">
        <span class="sfx-vol-label">Volume</span>
        <span class="sfx-vol-icon" id="sfxVolIcon">🔊</span>
        <input type="range" id="sfxVolumeSlider" min="0" max="100" value="80" />
        <span class="sfx-vol-val" id="sfxVolVal">80%</span>
    </div>

    <div class="sfx-grid" id="sfxGrid">
        <div class="sfx-grid-empty" id="sfxGridEmpty">⏳ Carregando efeitos…</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        const { createClient } = require('@supabase/supabase-js')

        // ── Supabase (mesma config do app principal) ──────────────────────
        const SUPABASE_URL = 'https://jxwjvaanfzufklyrsxrk.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_A2oU2UYshxiIvb6EHLS8BA_tWbveC72'

        let supabase
        try {
            supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
        } catch (e) {
            console.error('[SFX Panel] Erro Supabase:', e)
        }

        const sfxGrid = document.getElementById('sfxGrid')
        const sfxEmpty = document.getElementById('sfxGridEmpty')
        const sfxStatus = document.getElementById('sfxStatus')
        const volSlider = document.getElementById('sfxVolumeSlider')
        const volVal = document.getElementById('sfxVolVal')
        const volIcon = document.getElementById('sfxVolIcon')

        let sfxCache = []

        // ── Volume ────────────────────────────────────────────────────────
        function getVolume() {
            return parseInt(volSlider.value) / 100
        }

        volSlider.addEventListener('input', () => {
            const v = parseInt(volSlider.value)
            volVal.textContent = v + '%'
            volIcon.textContent = v === 0 ? '🔇' : v < 40 ? '🔈' : v < 70 ? '🔉' : '🔊'
        })

        // ── Carregar efeitos do banco ─────────────────────────────────────
        async function loadSfx() {
            if (!supabase) {
                sfxStatus.textContent = 'Erro: Supabase'
                sfxStatus.className = 'sfx-status error'
                sfxEmpty.textContent = '❌ Erro ao conectar com o banco de dados.'
                return
            }

            try {
                const { data, error } = await supabase
                    .from('sound_effects')
                    .select('id, name, audio_url')
                    .order('name')

                if (error) throw error

                sfxCache = data || []
                sfxStatus.textContent = sfxCache.length + ' efeito(s)'
                sfxStatus.className = 'sfx-status connected'
                renderGrid()
            } catch (e) {
                console.error('[SFX Panel] Erro ao carregar:', e)
                sfxStatus.textContent = 'Erro ao carregar'
                sfxStatus.className = 'sfx-status error'
                sfxEmpty.textContent = '❌ Falha ao carregar efeitos.\n' + (e.message || '')
            }
        }

        // ── Renderizar grid ───────────────────────────────────────────────
        function renderGrid() {
            sfxGrid.querySelectorAll('.sfx-btn').forEach(el => el.remove())

            if (sfxCache.length === 0) {
                sfxEmpty.style.display = 'block'
                sfxEmpty.innerHTML = '🔇<br>Nenhum efeito sonoro cadastrado.'
                return
            }
            sfxEmpty.style.display = 'none'

            sfxCache.forEach(sfx => {
                const btn = document.createElement('button')
                btn.className = 'sfx-btn'

                const nameEl = document.createElement('span')
                nameEl.className = 'sfx-btn-name'
                nameEl.textContent = sfx.name
                btn.appendChild(nameEl)

                const modeEl = document.createElement('span')
                modeEl.className = 'sfx-btn-mode'
                modeEl.textContent = 'Mode: PUSH'
                btn.appendChild(modeEl)

                // Clique → envia IPC com volume atual
                btn.addEventListener('mousedown', () => {
                    btn.classList.add('sfx-playing')
                    ipcRenderer.send('sfx-play', {
                        audioUrl: sfx.audio_url,
                        sfxName: sfx.name,
                        volume: getVolume()
                    })
                    console.log('[SFX Panel] Play:', sfx.name, 'vol:', getVolume())
                })

                btn.addEventListener('mouseup', () => {
                    setTimeout(() => btn.classList.remove('sfx-playing'), 250)
                })
                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('sfx-playing')
                })

                sfxGrid.appendChild(btn)
            })
        }

        // ── F5 recarrega a lista ──────────────────────────────────────────
        document.addEventListener('keydown', e => {
            if (e.key === 'F5') {
                e.preventDefault()
                sfxStatus.textContent = 'Recarregando…'
                sfxStatus.className = 'sfx-status'
                loadSfx()
            }
        })

        // ── Init ──────────────────────────────────────────────────────────
        loadSfx()
    </script>
</body>

</html>
