<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        #player {
            width: 1px;
            height: 1px;
        }
    </style>
</head>

<body>
    <div id="player"></div>

    <script>
        var ytPlayer = null
        var ytReady = false
        var pendingVideoId = null
        var pendingSeekTime = 0
        var currentVolume = 60
        var bufferTimer = null

        var tag = document.createElement('script')
        tag.src = 'https://www.youtube.com/iframe_api'
        document.head.appendChild(tag)

        window.onYouTubeIframeAPIReady = function () {
            ytReady = true
            console.log('[MusicPlayer] YouTube IFrame API pronta')
            if (pendingVideoId) {
                doLoad(pendingVideoId, pendingSeekTime)
                pendingVideoId = null
            }
        }

        function clearBufferTimer() {
            if (bufferTimer) { clearTimeout(bufferTimer); bufferTimer = null }
        }

        function onStateChange(e) {
            console.log('[MusicPlayer] state changed:', e.data)
            // 3 = BUFFERING — se travar por mais de 4s, tenta recuperar
            if (e.data === YT.PlayerState.BUFFERING) {
                clearBufferTimer()
                bufferTimer = setTimeout(function () {
                    if (!ytPlayer) return
                    var t = ytPlayer.getCurrentTime() || 0
                    console.log('[MusicPlayer] buffering timeout — seekando para recuperar:', t)
                    ytPlayer.seekTo(t + 0.1, true)
                }, 4000)
            } else {
                clearBufferTimer()
            }
        }

        function doLoad(videoId, seekTime) {
            console.log('[MusicPlayer] doLoad — videoId:', videoId, 'seekTime:', seekTime)
            if (ytPlayer) {
                ytPlayer.loadVideoById({ videoId: videoId, startSeconds: Math.floor(seekTime || 0) })
                ytPlayer.setVolume(currentVolume)
            } else {
                ytPlayer = new YT.Player('player', {
                    height: '1', width: '1',
                    videoId: videoId,
                    playerVars: {
                        autoplay: 1,
                        controls: 0,
                        loop: 1,
                        playlist: videoId,
                        start: Math.floor(seekTime || 0),
                        vq: 'tiny',            // ← força qualidade mínima
                        modestbranding: 1,
                        rel: 0,
                        iv_load_policy: 3,
                    },
                    events: {
                        onReady: function (e) {
                            console.log('[MusicPlayer] onReady')
                            e.target.setPlaybackQuality('tiny') // ← reforça qualidade mínima
                            e.target.setVolume(currentVolume)
                            e.target.playVideo()
                        },
                        onStateChange: onStateChange,
                        onError: function (e) {
                            console.error('[MusicPlayer] erro:', e.data)
                        }
                    }
                })
            }
        }

        window.musicPlay = function (videoId, seekTime) {
            console.log('[MusicPlayer] musicPlay — videoId:', videoId, 'seekTime:', seekTime)
            if (!ytReady) { pendingVideoId = videoId; pendingSeekTime = seekTime; return }
            doLoad(videoId, seekTime)
        }

        window.musicStop = function () {
            console.log('[MusicPlayer] musicStop')
            clearBufferTimer()
            if (ytPlayer) ytPlayer.stopVideo()
        }

        window.musicSetVolume = function (vol) {
            currentVolume = vol
            if (ytPlayer) {
                ytPlayer.setVolume(vol)
                if (vol === 0) ytPlayer.mute()
                else ytPlayer.unMute()
            }
        }
    </script>
</body>

</html>
